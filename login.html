<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Halaman Masuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Rubik', sans-serif;
    }

    html, body {
      height: 100%;
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      width: 1000px;
      height: 600px;
      border-radius: 0;
      overflow: hidden;
    }

    .form-section {
      flex: 1;
      background-color: white;
      border-top-left-radius: 100px;
      border-bottom-left-radius: 100px;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-section h2 {
      color: #3b73a1;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .form-section input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 2px solid black;
      border-radius: 12px;
      margin-bottom: 20px;
      background-color: white;
    }

    .forgot {
      font-size: 14px;
      font-weight: 600;
      color: black;
      margin-bottom: 25px;
    }

    .button-group {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }

    .btn-masuk {
      background-color: #a9d59f;
      color: black;
      font-weight: bold;
      font-size: 16px;
      padding: 12px 30px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-daftar {
      background-color: #3b73a1;
      color: white;
      font-weight: bold;
      font-size: 16px;
      padding: 12px 30px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .social-icons {
      display: flex;
      gap: 20px;
    }

    .icon-box {
      background-color: #3b73a1;
      border-radius: 12px;
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .icon-box img {
      width: 28px;
      height: 28px;
    }

    .divider {
      width: 8px;
      background-color: black;
    }

    .quote-section {
      flex: 1;
      background-color: #3b73a1;
      color: black;
      padding: 60px 40px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-top-right-radius: 100px;
      border-bottom-right-radius: 100px;
    }

    .quote-section h3 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      color: black;
    }

    .quote-section p {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.6;
      margin: 0;
    }

    .quote-section span {
      display: block;
      margin-top: 15px;
      font-size: 16px;
      font-weight: 400;
    }

    .circle-decoration {
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 320px;
      height: 320px;
      border: 20px solid #a9d59f;
      border-radius: 50%;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-section">
      <h2>MASUK</h2>
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <div class="forgot">Lupa Akun?</div>
      <div class="button-group">
        <button class="btn-masuk">Masuk</button>
        <button class="btn-daftar">Daftar</button>
      </div>
      <div class="social-icons">
        <div class="icon-box">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
        </div>
        <div class="icon-box">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook" />
        </div>
        <div class="icon-box">
          <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub" />
        </div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="quote-section">
      <h3>BARISAN PERBAIKAN</h3>
      <p>
        “The new source of power<br />
        is not money in the hands of a few,<br />
        but information in the hands of many.”
      </p>
      <span>John Naisbitt</span>
      <div class="circle-decoration"></div>
    </div>
  </div>
</body>
</html>
